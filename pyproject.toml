[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-bot-kit"
version = "0.1.1"
description = "Каркас Telegram-бота на aiogram 3: слои, транзакции, deny-by-default авторизация коллбэков"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30,<4",
    "aiosqlite>=0.22",
    "cryptography>=45",
    "dishka>=1.10,<2",
    "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/PahaKush/tg-bot-kit"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.16", "mypy>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/tgkit"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
